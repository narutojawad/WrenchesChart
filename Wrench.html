    <style>

<body class="p-4 sm:p-8 flex justify-center items-center min-h-screen">

    <div class="bg-white p-6 sm:p-10 rounded-xl shadow-2xl max-w-lg w-full">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">Flange Bolt Tool</h1>
        <p class="text-gray-500 text-center mb-8 text-sm">Select NPS and Class to find wrench size and bolt quantity.</p>

        <!-- Form Elements -->
        <div class="space-y-6">
            <!-- NPS Dropdown -->
            <div>
                <label for="size-select" class="block text-sm font-medium text-gray-700 mb-1">Nominal Pipe Size (NPS)</label>
                <select id="size-select" onchange="updateClasses()" class="block w-full px-4 py-3 bg-white border border-gray-300 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200">
                    <option value="" disabled selected>-- Select Size --</option>
                </select>
            </div>

            <!-- Pressure Rating Dropdown -->
            <div>
                <label for="class-select" class="block text-sm font-medium text-gray-700 mb-1">Pressure Class (Rating)</label>
                <select id="class-select" onchange="displayInfo()" disabled class="block w-full px-4 py-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200">
                    <option value="" disabled selected>-- Select Class --</option>
                </select>
            </div>

            <!-- Result Display -->
            <div id="flange-info" class="p-4 bg-indigo-50 border-l-4 border-indigo-500 text-indigo-800 rounded-md text-sm sm:text-base transition-all duration-300">
                Select both a size and a class to see the required specifications.
            </div>
        </div>

        <footer class="mt-8 text-center text-gray-400 text-xs italic">
            Reference Data: ASME B16.5 & B16.47
			<br><br> Tool Created by Jawad Al-Saeed
        </footer>
    </div>

        function parseFlangeSize(sizeStr) {
            const cleanedStr = sizeStr.replace(/\"/g, '');
            if (cleanedStr.includes(' ')) {
                const parts = cleanedStr.split(' ');
                const whole = parseFloat(parts[0]);
                const fractionParts = parts[1].split('/');
                return whole + (parseFloat(fractionParts[0]) / parseFloat(fractionParts[1]));
            }
            if (cleanedStr.includes('/')) {
                const parts = cleanedStr.split('/');
                return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            return parseFloat(cleanedStr);
        }

        function populateSizes() {
            const sizeSelect = document.getElementById('size-select');
            const sortedKeys = Object.keys(flangeData).sort((a, b) => parseFlangeSize(a) - parseFlangeSize(b));
            
            sortedKeys.forEach(size => {
                const option = document.createElement('option');
                option.value = size;
                option.textContent = size;
                sizeSelect.appendChild(option);
            });
        }

        function updateClasses() {
            const sizeSelect = document.getElementById('size-select');
            const classSelect = document.getElementById('class-select');
            const selectedSize = sizeSelect.value;
            
            classSelect.innerHTML = '<option value="" disabled selected>-- Select Class --</option>';
            classSelect.disabled = true;
            classSelect.classList.replace('bg-white', 'bg-gray-100');
            clearInfo();

            if (selectedSize) {
                const classes = Object.keys(flangeData[selectedSize]).sort((a, b) => parseInt(a) - parseInt(b));
                classes.forEach(flangeClass => {
                    const option = document.createElement('option');
                    option.value = flangeClass;
                    option.textContent = flangeClass;
                    classSelect.appendChild(option);
                });
                classSelect.disabled = false;
                classSelect.classList.replace('bg-gray-100', 'bg-white');
            }
        }

        function displayInfo() {
            const sizeSelect = document.getElementById('size-select');
            const classSelect = document.getElementById('class-select');
            const infoDisplay = document.getElementById('flange-info');
            
            const selectedSize = sizeSelect.value;
            const selectedClass = classSelect.value;

            if (selectedSize && selectedClass) {
                const specs = flangeData[selectedSize][selectedClass];
                infoDisplay.innerHTML = `<span class="font-semibold text-gray-900">Specs for ${selectedSize} Class ${selectedClass}:</span><br>Wrench: ${specs.wrench}<br>Bolts: ${specs.bolts}`;
                infoDisplay.classList.remove('bg-indigo-50', 'border-indigo-500', 'text-indigo-800');
                infoDisplay.classList.add('bg-green-50', 'border-green-500', 'text-green-800');
            }
        }

        function clearInfo() {
            const infoDisplay = document.getElementById('flange-info');
            infoDisplay.innerHTML = "Select both a size and a class to see the required specifications.";
            infoDisplay.classList.add('bg-indigo-50', 'border-indigo-500', 'text-indigo-800');
            infoDisplay.classList.remove('bg-green-50', 'border-green-500', 'text-green-800');
        }

        document.addEventListener('DOMContentLoaded', populateSizes);

</body>
</html>
